set -g mouse on
set -g set-clipboard on
set-option -g history-limit 50000

# Esc is Claude Code's interrupt key; no delay
set -s escape-time 0

# True color support (Claude Code themes render properly)
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'

# Pass modified keys through (Shift+Enter = newline in Claude Code)
set -s extended-keys on
set -as terminal-features ',*:extkeys'

# Pass through OSC escape sequences (notifications, etc.)
set -g allow-passthrough on

# New panes open in same directory
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf

# Renumber windows when one is closed
set-option -g renumber-windows on

# Windows/panes start at 1
set -g base-index 1
setw -g pane-base-index 1

bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection -x